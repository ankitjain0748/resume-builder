
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Responsive Design -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <!-- Primary SEO -->
    <title>
      Free ATS Resume Builder | Create & Download Professional Resumes
    </title>

    <meta
      name="description"
      content="Build a professional, ATS-friendly resume for free. Customize your work experience, education, skills and projects, preview your resume, and download it as a PDF."
    />

    <meta
      name="keywords"
      content="ATS Resume Builder, Free Resume Builder, Online Resume Maker, ATS-Friendly Resume Templates, Professional Resume Templates, Resume Builder for Freshers, Resume PDF Download, CV Maker Online"
    />

    <meta name="author" content="ATS Pro Resume Builder" />
    <meta name="application-name" content="ATS Pro Resume Builder" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="color-scheme" content="light" />

    <!-- Search Engine Indexing -->
    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />
    <meta name="googlebot" content="index, follow" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://resume-builder-eight-delta.vercel.app/"
    />

    <!-- Favicon and App Icons -->
    <link
      rel="icon"
      href="%PUBLIC_URL%/favicon.ico"
      sizes="any"
    />
    <link
      rel="icon"
      type="image/png"
      href="%PUBLIC_URL%/favicon.png"
    />
    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/logo192.png"
    />
    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />

    <!-- Browser Security / Referrer -->
    <meta
      name="referrer"
      content="strict-origin-when-cross-origin"
    />

    <!-- Open Graph: Facebook, LinkedIn -->
    <meta property="og:type" content="website" />
    <meta
      property="og:site_name"
      content="ATS Pro Resume Builder"
    />
    <meta
      property="og:title"
      content="Free ATS Resume Builder | Create Professional Resumes"
    />
    <meta
      property="og:description"
      content="Create a professional, ATS-friendly resume in minutes. Customize your details, preview your resume, and download it as a PDF."
    />
    <meta
      property="og:url"
      content="https://resume-builder-eight-delta.vercel.app/"
    />
    <meta
      property="og:image"
      content="https://resume-builder-eight-delta.vercel.app/og-image.png"
    />
    <meta
      property="og:image:alt"
      content="ATS Pro Resume Builder - Create professional ATS-friendly resumes"
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Free ATS Resume Builder | ATS Pro"
    />
    <meta
      name="twitter:description"
      content="Build an ATS-friendly resume for free, customize your details, and download your resume as a PDF."
    />
    <meta
      name="twitter:image"
      content="https://resume-builder-eight-delta.vercel.app/og-image.png"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "ATS Pro Resume Builder",
        "url": "https://resume-builder-eight-delta.vercel.app/",
        "description": "Create professional, ATS-friendly resumes online. Customize your experience, education, skills and projects, preview your resume, and download it as a PDF.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript and a modern web browser",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to use ATS Pro Resume Builder.
    </noscript>

    <div id="root"></div>
  </body>
</html>
